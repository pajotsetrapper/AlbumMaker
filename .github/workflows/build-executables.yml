name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-intel
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    env:
      # Lets the GUI --packaging-smoke-test run without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-packaging.txt

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-util1 \
            libxcb-xinerama0 libxcb-randr0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libx11-xcb1

      - name: Install packaging dependencies
        run: python -m pip install -r requirements-packaging.txt

      - name: Build self-contained app
        run: python tools/build_executable.py

      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/executable/AlbumMaker -DestinationPath AlbumMaker-${{ matrix.platform }}.zip

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/executable/AlbumMaker.app AlbumMaker-${{ matrix.platform }}.zip

      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -czf AlbumMaker-${{ matrix.platform }}.tar.gz -C dist/executable AlbumMaker

      - uses: actions/upload-artifact@v4
        with:
          name: AlbumMaker-${{ matrix.platform }}
          path: AlbumMaker-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30

name: Build desktop executables

# Runs on a version tag (v3.0.0, ...) and on demand. A tag build also
# publishes a GitHub Release with the downloads and their checksums.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-packaging.txt
      - name: Check the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_version.py "$GITHUB_REF_NAME"
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python tools/check_version.py)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  build:
    name: ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-intel
          - runner: macos-15
            platform: macos-arm64
    env:
      # Lets the GUI --packaging-smoke-test run without a display.
      QT_QPA_PLATFORM: offscreen
      PACKAGE: AlbumMaker-${{ needs.test.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-packaging.txt
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-packaging.txt
      # Writes the app plus LICENSE, THIRD_PARTY_NOTICES.md and
      # THIRD_PARTY_NOTICES.txt into a folder named after the download, so the
      # license files sit next to the app when it is unpacked.
      - name: Build self-contained app
        shell: bash
        run: python tools/build_executable.py --output "dist/$PACKAGE"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "$env:PACKAGE.zip"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/$PACKAGE" "$PACKAGE.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum AlbumMaker-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?([ ]|$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "AlbumMaker ${{ needs.test.outputs.version }}" \
            --notes-file notes.md
